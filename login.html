<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Iniciar sesión o crear cuenta en Planificador Pro Docente." />
  <meta name="theme-color" content="#6d46c7" />
  <title>Planificador Pro Docente – Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
</head>
<body>
  <div class="page-wrapper">
    <div class="centered">
      <main class="auth-card glass">
        <h1 class="h3">Planificador Pro Docente</h1>

        <form id="login-form" class="form-group" autocomplete="off">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />

          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <hr />
        <p>¿No tienes cuenta? Regístrate gratis</p>

        <form id="register-form" class="form-group" autocomplete="off">
          <label for="reg-name">Nombre completo</label>
          <input type="text" id="reg-name" name="nombre_completo" placeholder="María Pérez" required />

          <label for="reg-cedula">Cédula</label>
          <input type="text" id="reg-cedula" name="cedula" placeholder="V-12345678" required />

          <label for="reg-escuela">Escuela</label>
          <input type="text" id="reg-escuela" name="escuela" placeholder="E.B. Simón Bolívar" required />

          <label for="reg-grado">Grado que imparte</label>
          <select id="reg-grado" name="grado_imparte" required>
            <option value="1">1°</option>
            <option value="2">2°</option>
            <option value="3">3°</option>
            <option value="4">4°</option>
            <option value="5">5°</option>
            <option value="6">6°</option>
          </select>

          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" name="email" placeholder="tucorreo@ejemplo.com" required />

          <label for="reg-pass">Contraseña</label>
          <input type="password" id="reg-pass" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required />

          <button type="submit" class="btn btn-success">Crear cuenta</button>
        </form>
      </main>
    </div>

    <footer class="site-footer">
      <div class="footer-line">📧 <a href="mailto:denyersequera2511@gmail.com">denyersequera2511@gmail.com</a></div>
      <div class="footer-line">© 2026 Planificador Pro Docente · San Rafael de Onoto · Todos los derechos reservados.</div>
    </footer>
  </div>

  <script type="module">
    import { signIn, registerTeacher, obtenerUsuarioActual } from "./js/auth.js";
    import { initTheme } from "./js/theme.js";

    initTheme();
    const usuarioActual = await obtenerUsuarioActual();
    if (usuarioActual) window.location.replace("dashboard.html");

    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = true;
      const email = loginForm.email.value.trim();
      const password = loginForm.password.value;
      await signIn(email, password);
      button.disabled = false;
    });

    const registerForm = document.getElementById('register-form');
    registerForm.addEventListener('submit', async e => {
      e.preventDefault();
      const button = registerForm.querySelector('button[type="submit"]');
      button.disabled = true;
      const data = {
        email: registerForm['reg-email'].value.trim(),
        password: registerForm['reg-pass'].value,
        nombre_completo: registerForm['reg-name'].value.trim(),
        cedula: registerForm['reg-cedula'].value.trim(),
        escuela: registerForm['reg-escuela'].value.trim(),
        grado_imparte: registerForm['reg-grado'].value
      };
      await registerTeacher(data);
      button.disabled = false;
    });
  </script>
</body>
</html>
